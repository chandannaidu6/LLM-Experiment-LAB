[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-experiment-lab"
version = "0.1.0"
description = "RAG experiment lab with PDF chunking, BM25, dense retrievers, and LLM evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "pytest",
    "numpy",
    "scikit-learn",
    # add any others you actually use (e.g. openai, rank_bm25, sentence-transformers, etc.)
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "chunkers*",
    "retrievers*",
    "llm*",
    "evaluation*",
    "preprocessing*",
]
exclude = [
    "Data*",
    "QA*",
    "prompts*",
    "tests*",
]